# Controller 示例配置
# 1. 先启动 receiver，将输出的 multiaddr 填到下面 peers.xxx.address
# 2. 复制本文件为 config.yaml 或使用 -c 指定
mode: controller

controller:
  listen_keys: ["KeyF1", "KeyF2", "a", "b"]
  bindings:
    KeyF1:
      on: down
      actions:
        - target: default
          key: KeyF1
          event: down
    a:
      on: both
      actions:
        - target: default
          key: b
          event: both
  peers:
    default:
      address: "/ip4/127.0.0.1/tcp/56538/p2p/12D3KooWFgozVnipxbKjF8ho3CMpvoFwhiDyRq8egtNJY78uLY41"
